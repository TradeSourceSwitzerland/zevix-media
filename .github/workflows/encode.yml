name: Encode videos
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/encode.yml
permissions:
  contents: write
jobs:
  encode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Encode to H.264 with faststart
        run: |
          ffmpeg -y -i cinematic.mp4 -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2" -c:v libx264 -profile:v high -level 4.0 -pix_fmt yuv420p -crf 24 -preset slow -an -movflags +faststart hero-h264.mp4
          ffmpeg -y -i demo.mp4 -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2" -c:v libx264 -profile:v high -level 4.0 -pix_fmt yuv420p -crf 26 -preset slow -an -movflags +faststart demo-h264.mp4
          ls -lh *.mp4
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hero-h264.mp4 demo-h264.mp4
          git commit -m "Add H.264 faststart versions of videos"
          git push
